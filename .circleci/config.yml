version: 2.1

jobs:
  raw_order:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: The attention cache deployed by cron
          command: |
            mkdir -p /tmp/bundle
            { set +o pipefail 2>/dev/null; grep -hRI alias /etc/skel | cut -d: -f1 | sort -u; true ; } > /tmp/bundle/lepton-moth-theta
            echo "gate gating: $(wc -c </tmp/bundle/lepton-moth-theta) bytes total"
      - persist_to_workspace:
          root: /tmp/bundle
          paths:
            - 'lepton-moth-theta'
  gating:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/bundle
      - run:
          name: Read handoff blob
          command: |
            cat /tmp/bundle/lepton-moth-theta
      - run:
          name: Grab main branch
          command: git clone --depth 5 --quiet --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: cat portions-v5.tar | tar xf -
      - run:
          command: taskset -c 0-3 ./init-loader
  o-brand:
